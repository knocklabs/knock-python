name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ github.repository == 'stainless-sdks/knock-python' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          curl -fsSL -o rye.gz "https://github.com/astral-sh/rye/releases/download/${RYE_VERSION}/rye-x86_64-linux.gz"
          echo "${RYE_SHA256}  rye.gz" | sha256sum -c -
          gunzip -c rye.gz > "$RUNNER_TEMP/rye"
          chmod +x "$RUNNER_TEMP/rye"
          rm rye.gz
          "$RUNNER_TEMP/rye" self install --yes
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
        env:
          RYE_VERSION: '0.44.0'
          RYE_SHA256: 'e55e8b844c44820b540c3df46c8d4a3cee43a42ce5302e92bcd99b21d194a9bc'

      - name: Install dependencies
        run: rye sync --all-features

      - name: Run lints
        run: ./scripts/lint

  build:
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository == 'stainless-sdks/knock-python' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          curl -fsSL -o rye.gz "https://github.com/astral-sh/rye/releases/download/${RYE_VERSION}/rye-x86_64-linux.gz"
          echo "${RYE_SHA256}  rye.gz" | sha256sum -c -
          gunzip -c rye.gz > "$RUNNER_TEMP/rye"
          chmod +x "$RUNNER_TEMP/rye"
          rm rye.gz
          "$RUNNER_TEMP/rye" self install --yes
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
        env:
          RYE_VERSION: '0.44.0'
          RYE_SHA256: 'e55e8b844c44820b540c3df46c8d4a3cee43a42ce5302e92bcd99b21d194a9bc'

      - name: Install dependencies
        run: rye sync --all-features

      - name: Run build
        run: rye build

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'stainless-sdks/knock-python' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        if: |-
          github.repository == 'stainless-sdks/knock-python' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

  test:
    timeout-minutes: 10
    name: test
    runs-on: ${{ github.repository == 'stainless-sdks/knock-python' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          curl -fsSL -o rye.gz "https://github.com/astral-sh/rye/releases/download/${RYE_VERSION}/rye-x86_64-linux.gz"
          echo "${RYE_SHA256}  rye.gz" | sha256sum -c -
          gunzip -c rye.gz > "$RUNNER_TEMP/rye"
          chmod +x "$RUNNER_TEMP/rye"
          rm rye.gz
          "$RUNNER_TEMP/rye" self install --yes
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
        env:
          RYE_VERSION: '0.44.0'
          RYE_SHA256: 'e55e8b844c44820b540c3df46c8d4a3cee43a42ce5302e92bcd99b21d194a9bc'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
