# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to PyPI in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/knocklabs/knock-python/actions/workflows/publish-pypi.yml
name: Publish PyPI
on:
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rye
        run: |
          curl -fsSL -o rye.gz "https://github.com/astral-sh/rye/releases/download/${RYE_VERSION}/rye-x86_64-linux.gz"
          echo "${RYE_SHA256}  rye.gz" | sha256sum -c -
          gunzip -c rye.gz > "$RUNNER_TEMP/rye"
          chmod +x "$RUNNER_TEMP/rye"
          rm rye.gz
          "$RUNNER_TEMP/rye" self install --yes
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
        env:
          RYE_VERSION: '0.44.0'
          RYE_SHA256: 'e55e8b844c44820b540c3df46c8d4a3cee43a42ce5302e92bcd99b21d194a9bc'

      - name: Publish to PyPI
        run: |
          bash ./bin/publish-pypi
        env:
          PYPI_TOKEN: ${{ secrets.KNOCK_PYPI_TOKEN || secrets.PYPI_TOKEN }}
